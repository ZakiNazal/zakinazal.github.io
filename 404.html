<!DOCTYPE html>

  <meta name="theme-color" content="#f2f2f0" />

  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, and a
       relative path would resolve against /some/deep/path/ and 404 as well. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="lost">

    <a class="nav__cta" href="/#contact">
      <span class="dot" aria-hidden="true"></span> Let's talk

  </header>

  <main class="lost__main">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Error 404</p>
    <h1 class="lost__code"><span class="sr-only">Page not found. Error </span>404</h1>
    <p class="lost__note">This page doesn't exist. It may have moved, or the link has a typo. Everything else is one click away.</p>
    <div class="lost__actions">
      <a class="btn btn--solid" href="/"><span>Back to the portfolio</span><i aria-hidden="true">←</i></a>
      <a class="btn" href="/#work"><span>See the projects</span><i aria-hidden="true">→</i></a>
    </div>
  </main>
</body>

</html>
