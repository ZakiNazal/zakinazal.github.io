<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
  aria-label="LifeSkills — a daily exercise streak grid, a mood line, and today's check-in">
  <rect width="800" height="500" fill="#101827" />

  <g stroke="#1e2b46" stroke-width="1">
    <path d="M.5 74H800M.5 424H800" />
  </g>

  <text x="60" y="52" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.2"
    fill="#8fa3c8">THIS STREAK</text>

  <!-- the streak number carries the section -->
  <text x="60" y="176" font-family="Georgia, serif" font-size="104" fill="#e3e9f6">31</text>
  <text x="176" y="176" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2.4"
    fill="#7ba4ff">DAYS</text>

  <!-- day grid: 7 wide, 5 rows. filled = moved that day -->
  <g transform="translate(60 214)">
    <g fill="#7ba4ff">
      <rect width="20" height="20" rx="3" x="0" y="0" /><rect width="20" height="20" rx="3" x="28" y="0" />
      <rect width="20" height="20" rx="3" x="56" y="0" /><rect width="20" height="20" rx="3" x="84" y="0" />
      <rect width="20" height="20" rx="3" x="112" y="0" /><rect width="20" height="20" rx="3" x="140" y="0" />
      <rect width="20" height="20" rx="3" x="168" y="0" />

      <rect width="20" height="20" rx="3" x="0" y="28" /><rect width="20" height="20" rx="3" x="28" y="28" />
      <rect width="20" height="20" rx="3" x="56" y="28" /><rect width="20" height="20" rx="3" x="112" y="28" />
      <rect width="20" height="20" rx="3" x="140" y="28" /><rect width="20" height="20" rx="3" x="168" y="28" />

      <rect width="20" height="20" rx="3" x="0" y="56" /><rect width="20" height="20" rx="3" x="28" y="56" />
      <rect width="20" height="20" rx="3" x="56" y="56" /><rect width="20" height="20" rx="3" x="84" y="56" />
      <rect width="20" height="20" rx="3" x="112" y="56" /><rect width="20" height="20" rx="3" x="168" y="56" />

      <rect width="20" height="20" rx="3" x="28" y="84" /><rect width="20" height="20" rx="3" x="56" y="84" />
      <rect width="20" height="20" rx="3" x="84" y="84" /><rect width="20" height="20" rx="3" x="112" y="84" />
      <rect width="20" height="20" rx="3" x="140" y="84" /><rect width="20" height="20" rx="3" x="168" y="84" />
    </g>
    <g fill="#1c2a45">
      <rect width="20" height="20" rx="3" x="84" y="28" />
      <rect width="20" height="20" rx="3" x="140" y="56" />
      <rect width="20" height="20" rx="3" x="0" y="84" />
    </g>
    <!-- today, still open -->
    <rect width="20" height="20" rx="3" x="0" y="112" fill="none" stroke="#7ba4ff" stroke-width="2" />
    <g fill="#243350">
      <rect width="20" height="20" rx="3" x="28" y="112" /><rect width="20" height="20" rx="3" x="56" y="112" />
      <rect width="20" height="20" rx="3" x="84" y="112" /><rect width="20" height="20" rx="3" x="112" y="112" />
      <rect width="20" height="20" rx="3" x="140" y="112" /><rect width="20" height="20" rx="3" x="168" y="112" />
    </g>
    <text x="0" y="158" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.8"
      fill="#55648a">MON</text>
    <text x="168" y="158" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.8"
      fill="#55648a">SUN</text>
  </g>

  <!-- mood line, five weeks -->
  <g transform="translate(340 214)">
    <text font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="2" fill="#55648a">MOOD</text>
    <g transform="translate(0 20)">
      <g stroke="#1e2b46" stroke-width="1">
        <path d="M0 0h380M0 40h380M0 80h380" />
      </g>
      <polyline points="0,62 76,44 152,52 228,22 304,30 380,10" fill="none" stroke="#7ba4ff" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#101827" stroke="#7ba4ff" stroke-width="2.5">
        <circle cx="0" cy="62" r="4" />
        <circle cx="152" cy="52" r="4" />
        <circle cx="304" cy="30" r="4" />
        <circle cx="380" cy="10" r="4" />
      </g>
    </g>
  </g>

  <!-- today's check-in prompt -->
  <g transform="translate(340 340)">
    <rect width="380" height="56" rx="4" fill="#18233a" stroke="#2b3c5e" stroke-width="1" />
    <text x="20" y="34" font-family="Georgia, serif" font-size="19" fill="#e3e9f6">Did you move today?</text>
    <rect x="286" y="14" width="76" height="28" rx="3" fill="#7ba4ff" />
    <text x="324" y="33" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11"
      letter-spacing="1.6" fill="#101827">CHECK IN</text>
  </g>

  <text x="60" y="464" font-family="ui-monospace, monospace" font-size="12.5" letter-spacing="2.2"
    fill="#55648a">THE STREAK IS THE POINT</text>
</svg>
