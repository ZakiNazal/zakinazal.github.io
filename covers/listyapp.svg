<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
  aria-label="ListyApp — a shared checklist with items assigned to different people">
  <rect width="800" height="500" fill="#101827" />

  <!-- faint construction grid -->
  <g stroke="#1b2740" stroke-width="1">
    <path d="M60 .5V500M740 .5V500M.5 76H800M.5 424H800" />
  </g>

  <!-- header: list name + the people on it -->
  <text x="60" y="56" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2.2" fill="#8fa3c8">
    WEEKEND TRIP
  </text>
  <g>
    <circle cx="700" cy="50" r="17" fill="#1c2a45" stroke="#7ba4ff" stroke-width="1.5" />
    <text x="700" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13"
      fill="#7ba4ff">Z</text>
    <circle cx="672" cy="50" r="17" fill="#1c2a45" stroke="#8fa3c8" stroke-width="1.5" />
    <text x="672" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13"
      fill="#8fa3c8">A</text>
    <circle cx="644" cy="50" r="17" fill="#1c2a45" stroke="#8fa3c8" stroke-width="1.5" />
    <text x="644" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13"
      fill="#8fa3c8">M</text>
  </g>

  <!-- row 1 — done -->
  <g transform="translate(60 118)">
    <rect x="0" y="0" width="26" height="26" rx="3" fill="#7ba4ff" />
    <path d="M6 13l5 5 9-10" fill="none" stroke="#101827" stroke-width="2.6" stroke-linecap="round"
      stroke-linejoin="round" />
    <text x="48" y="20" font-family="Georgia, serif" font-size="21" fill="#55648a">Book the campsite</text>
    <line x1="48" y1="13" x2="253" y2="13" stroke="#55648a" stroke-width="1.5" />
    <circle cx="666" cy="13" r="14" fill="#1c2a45" stroke="#55648a" stroke-width="1.5" />
    <text x="666" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11"
      fill="#55648a">A</text>
  </g>

  <!-- row 2 — open, mid-tick (the real-time moment) -->
  <g transform="translate(60 186)">
    <rect x="0" y="0" width="26" height="26" rx="3" fill="none" stroke="#7ba4ff" stroke-width="2" />
    <path d="M6 13l5 5 9-10" fill="none" stroke="#7ba4ff" stroke-width="2.6" stroke-linecap="round"
      stroke-linejoin="round" stroke-dasharray="22" stroke-dashoffset="11" opacity=".55" />
    <text x="48" y="20" font-family="Georgia, serif" font-size="21" fill="#e3e9f6">Pick up the tent</text>
    <text x="250" y="19" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.6"
      fill="#7ba4ff">MARIAM IS TICKING THIS</text>
    <circle cx="666" cy="13" r="14" fill="#1c2a45" stroke="#7ba4ff" stroke-width="1.5" />
    <text x="666" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11"
      fill="#7ba4ff">M</text>
  </g>

  <!-- row 3 — open -->
  <g transform="translate(60 254)">
    <rect x="0" y="0" width="26" height="26" rx="3" fill="none" stroke="#3a4b6d" stroke-width="2" />
    <text x="48" y="20" font-family="Georgia, serif" font-size="21" fill="#e3e9f6">Split the fuel money</text>
    <circle cx="666" cy="13" r="14" fill="#1c2a45" stroke="#8fa3c8" stroke-width="1.5" />
    <text x="666" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11"
      fill="#8fa3c8">Z</text>
  </g>

  <!-- row 4 — open -->
  <g transform="translate(60 322)">
    <rect x="0" y="0" width="26" height="26" rx="3" fill="none" stroke="#3a4b6d" stroke-width="2" />
    <text x="48" y="20" font-family="Georgia, serif" font-size="21" fill="#e3e9f6">Charge the power bank</text>
    <circle cx="666" cy="13" r="14" fill="none" stroke="#3a4b6d" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- footer meta -->
  <text x="60" y="462" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2"
    fill="#55648a">1 / 4 DONE</text>
  <g transform="translate(640 452)">
    <circle cx="0" cy="0" r="4" fill="#7ba4ff" />
    <text x="14" y="5" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2"
      fill="#7ba4ff">SYNCED</text>
  </g>
</svg>
