<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
  aria-label="SmartDesk — a fault ticket moving through triage, routing, repair and review, with an SLA clock">
  <rect width="800" height="500" fill="#101827" />

  <!-- four role lanes -->
  <g stroke="#1e2b46" stroke-width="1">
    <path d="M200.5 74V430M400.5 74V430M600.5 74V430" />
  </g>
  <line x1="40" y1="74" x2="760" y2="74" stroke="#2b3c5e" stroke-width="1" />

  <g font-family="ui-monospace, monospace" font-size="12.5" letter-spacing="2.2" fill="#55648a">
    <text x="60" y="56">REPORTER</text>
    <text x="222" y="56" fill="#7ba4ff">TRIAGE</text>
    <text x="422" y="56">TECHNICIAN</text>
    <text x="622" y="56">SUPERVISOR</text>
  </g>

  <!-- the ticket, sitting in triage -->
  <g transform="translate(222 116)">
    <rect x="0" y="0" width="156" height="104" rx="4" fill="#18233a" stroke="#7ba4ff" stroke-width="1.5" />
    <text x="14" y="26" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.6"
      fill="#7ba4ff">#4471</text>
    <text x="14" y="52" font-family="Georgia, serif" font-size="17" fill="#e3e9f6">Lift B stuck</text>
    <text x="14" y="72" font-family="Georgia, serif" font-size="17" fill="#e3e9f6">on floor 3</text>
    <rect x="14" y="82" width="58" height="14" rx="2" fill="#7ba4ff" />
    <text x="43" y="93" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9"
      letter-spacing="1.4" fill="#101827">P1</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#3a4b6d" stroke-width="1.5" fill="none">
    <path d="M150 168h58" marker-end="url(#tip)" />
    <path d="M392 168h58" marker-end="url(#tip)" />
    <path d="M592 168h58" marker-end="url(#tip)" />
  </g>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#3a4b6d" />
    </marker>
  </defs>

  <!-- reporter: the raw report -->
  <g transform="translate(60 130)" stroke="#2b3c5e" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="82" height="76" rx="4" />
    <path d="M16 22h50M16 40h50M16 58h30" />
  </g>

  <!-- technician + supervisor: waiting slots -->
  <g stroke="#243350" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <rect x="452" y="130" width="120" height="76" rx="4" />
    <rect x="652" y="130" width="88" height="76" rx="4" />
  </g>

  <!-- priority score readout -->
  <g transform="translate(60 268)">
    <text font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="2" fill="#55648a">SCORE</text>
    <text y="42" font-family="ui-monospace, monospace" font-size="40" fill="#e3e9f6">87</text>
    <g transform="translate(0 60)">
      <rect width="120" height="5" rx="2.5" fill="#243350" />
      <rect width="104" height="5" rx="2.5" fill="#7ba4ff" />
    </g>
  </g>

  <!-- SLA clock -->
  <g transform="translate(276 330)">
    <circle r="38" fill="none" stroke="#243350" stroke-width="6" />
    <circle r="38" fill="none" stroke="#7ba4ff" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="179 239" transform="rotate(-90)" />
    <text y="-2" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17"
      fill="#e3e9f6">2:14</text>
    <text y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.8"
      fill="#55648a">SLA LEFT</text>
  </g>

  <!-- recurring-fault flag -->
  <g transform="translate(452 288)">
    <text font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="2" fill="#55648a">SEEN
      BEFORE</text>
    <g transform="translate(0 22)">
      <g fill="#7ba4ff">
        <rect width="8" height="26" rx="1" y="14" />
        <rect width="8" height="34" rx="1" x="16" y="6" />
        <rect width="8" height="20" rx="1" x="32" y="20" />
        <rect width="8" height="40" rx="1" x="48" />
      </g>
      <g fill="#243350">
        <rect width="8" height="12" rx="1" x="64" y="28" />
        <rect width="8" height="16" rx="1" x="80" y="24" />
      </g>
      <line x1="0" y1="42" x2="96" y2="42" stroke="#2b3c5e" stroke-width="1" />
    </g>
    <text y="88" font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="1.6" fill="#7ba4ff">4×
      THIS QUARTER</text>
  </g>

  <line x1="40" y1="430" x2="760" y2="430" stroke="#2b3c5e" stroke-width="1" />
  <text x="60" y="464" font-family="ui-monospace, monospace" font-size="12.5" letter-spacing="2.2"
    fill="#55648a">ONE WORKFLOW · FOUR ROLES</text>
</svg>
